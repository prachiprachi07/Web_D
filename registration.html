<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6fc;
        }

        header {
            background-color: #293b65;
            color: white;
            height: 120px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        header img.logo {
            width: 80px ;
            height: 80px ;
            object-fit: contain;
            position: absolute;
            left: 15px;
            top: 15px;
            background: white;
        }

        header h2 {
            color: white;
            margin: 0;
        }

        .student {
            position: absolute;
            right: 15px;
            bottom: 12px;
            color: white;
            text-align: right;
            font-size: 12px;
        }

        nav {
            background-color: #b9c8e8;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #202e50;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        .box {
            width: 350px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid #dce4f5;
        }

        h2 {
            text-align: center;
            color: #293b65;
        }

        label {
            display: block;
            margin-top: 12px;
            color: #293b65;
        }

        input, select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #b9c8e8;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 18px;
            background-color: #293b65;
            color: white;
            border: none;
            cursor: pointer;
        }

        p {
            text-align: center;
        }

        footer {
            background-color: #293b65;
            color: white;
            text-align: center;
            padding: 12px;
        }
    </style>
</head>

<body>

<header>
    <img src="logo.jpg" class="logo" alt="College Logo">

    <h2>Online Book Store</h2>

    <div class="student">
        <b>Prachi</b><br>
        Roll No: 25190102020
    </div>
</header>

<nav>
    <a href="home.html">Home</a>
    <a href="login.html">Login</a>
    <a href="registration.html">Registration</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="cart.html">Cart</a>
</nav>

<div class="box">
    <h2>Registration Form</h2>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Mobile Number</label>
        <input type="tel" placeholder="Enter mobile number"
               pattern="[0-9]{10}" required>

        <label>Course</label>
        <select required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>Other</option>
        </select>

        <label>Password</label>
        <input type="password" placeholder="Create password" required>

        <button type="submit">Register</button>
    </form>

    <p>Already registered? <a href="login.html">Login</a></p>
</div>

<footer>
    Online Book Store | Read and Learn
</footer>

</body>
</html>
