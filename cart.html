<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - Online Book Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #064d2d;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background-color: #087a45;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: rgb(234, 247, 44);
        }

        .cart {
            width: 80%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #aaa;
        }

        .cart h2 {
            text-align: center;
            color: #064d2d;
            margin-bottom: 30px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .item h3 {
            color: #087a45;
            margin: 0;
        }

        .price {
            font-weight: bold;
        }

        .total {
            text-align: right;
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #064d2d;
        }

        .checkout {
            display: block;
            margin: 20px auto 0;
            background-color: #087a45;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .checkout:hover {
            background-color: #064d2d;
        }

        footer {
            background-color: #064d2d;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Book Store</h1>
    </header>

    <nav>
        <a href="home.html">Home</a>
        <a href="login.html">Login</a>
        <a href="registration.html">Registration</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="cart.html">Cart</a>
    </nav>

    <div class="cart">

        <h2>Shopping Cart</h2>

        <div class="item">
            <h3>Data Structures</h3>
            <p class="price">₹450</p>
        </div>

        <div class="item">
            <h3>Computer Networks</h3>
            <p class="price">₹550</p>
        </div>

        <div class="total">
            Total: ₹1000
        </div>

        <button class="checkout">
            Proceed to Checkout
        </button>

    </div>

    <footer>
        <p>© 2026 Online Book Store</p>
    </footer>

</body>

</html>
