    <title>Online Book Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6fc;
        }

       
header {
    background-color: #293b65;
    color: white;
    padding: 15px 20px;
    display: grid;
    grid-template-columns: 100px 1fr 200px;
    align-items: center;
    min-height: 80px;
}

.logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
    background-color: white;
}

header h2 {
    margin: 0;
    text-align: center;
}

.student {
    text-align: right;
    line-height: 1.6;
    font-size: 14px;
}


        nav {
            background-color: #b9c8e8;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #202e50;
            text-decoration: none;
            margin: 0 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffffff;
        }

        .container {
            display: flex;
        }

        aside {
            background-color: #dce4f5;
            width: 180px;
            min-height: 450px;
            padding: 20px;
        }

        aside a {
            display: block;
            color: #293b65;
            text-decoration: none;
            padding: 12px 0;
            font-weight: bold;
        }

        aside a:hover {
            color: #758fc5;
        }

        main {
            flex: 1;
            padding: 30px;
            background-color: white;
            min-height: 400px;
        }

        main h2 {
            color: #293b65;
        }

        footer {
            background-color: #293b65;
            color: white;
            text-align: center;
            padding: 12px;
        }

        (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .student {
                text-align: center;
            }

            nav a {
                display: inline-block;
                margin: 8px;
            }

            .container {
                flex-direction: column;
            }

            aside {
                width: auto;
                min-height: auto;
            }
        }
    </style>
</head>
